name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Placeholder values only — never real secrets. Enough for prisma generate + next build.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?pgbouncer=true
      DIRECT_URL: postgresql://postgres:postgres@db.ci-placeholder.supabase.co:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      NEXT_PUBLIC_SITE_URL: https://example.com
      # Optional at build; set placeholders so modules that read them do not throw
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      NEXTAUTH_SECRET: ci-placeholder-nextauth-secret-not-real
      EDITORIAL_API_KEY: ci-placeholder-editorial-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # Source-only tsc (tsconfig excludes .next). Clear any leftover build types first.
        run: rm -rf .next && npm run typecheck

      - name: Test (editorial)
        run: npm run test:editorial

      - name: Build
        run: npm run build
