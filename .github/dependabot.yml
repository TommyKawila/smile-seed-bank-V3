# GitHub Dependabot — npm security/version updates (SAF Phase A)
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      production-patch:
        dependency-type: production
        update-types:
          - patch
